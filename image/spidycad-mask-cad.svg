<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Mask Crimson Gradient -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="35%" stop-color="#e61937" />
      <stop offset="100%" stop-color="#8a071a" />
    </linearGradient>

    <!-- Glowing Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2f8ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- CAD Tech Cyan Glow -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <!-- Eye Honeycomb Hex Pattern -->
    <pattern id="hexPattern" width="10" height="17.32" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M5,0 L10,2.88 L10,8.66 L5,11.54 L0,8.66 L0,2.88 Z M5,17.32 L10,14.44 L10,8.66 L5,11.54 L0,8.66 L0,14.44 Z" fill="none" stroke="#0284c7" stroke-width="0.7" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="32" fill="url(#bgGrad)" />
  <rect width="800" height="800" rx="32" fill="url(#cadGrid)" />

  <!-- CAD Blueprint Construction Lines & Coordinate Axes -->
  <g opacity="0.4" stroke="#00f2fe" stroke-width="1" fill="none">
    <line x1="400" y1="40" x2="400" y2="590" stroke-dasharray="6,4" />
    <line x1="100" y1="310" x2="700" y2="310" stroke-dasharray="6,4" />
    
    <!-- Concentric Drafting Circles -->
    <circle cx="400" cy="310" r="230" stroke-dasharray="8,6" opacity="0.4" />
    <circle cx="400" cy="310" r="290" stroke-dasharray="3,6" opacity="0.25" />
    
    <!-- Coordinate Origin Point -->
    <circle cx="400" cy="310" r="5" stroke="#00f2fe" stroke-width="1.5" />

    <!-- Drafting Precision Markers -->
    <path d="M 180,140 L 180,120 L 200,120 M 620,140 L 620,120 L 600,120 M 180,480 L 180,500 L 200,500 M 620,480 L 620,500 L 600,500" stroke-width="2" />
  </g>

  <!-- CAD Dimension Callouts -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="110" y="305">Ø 460.00mm</text>
    <text x="408" y="75">AXIS Y [0, 1, 0]</text>
    <text x="615" y="305">X [1, 0, 0]</text>
    <text x="180" y="525">DEV.CAD://SPIDEY-MASK</text>
  </g>

  <!-- MAIN SPIDER-MAN MASK -->
  <g filter="url(#dropShadow)">
    <!-- Mask Silhouette Contour -->
    <path d="M 400,95 
             C 495,95 580,165 580,280 
             C 580,380 540,465 465,525 
             C 435,550 415,565 400,570 
             C 385,565 365,550 335,525 
             C 260,465 220,380 220,280 
             C 220,165 305,95 400,95 Z" 
          fill="url(#maskGrad)" 
          stroke="#ff6b81" 
          stroke-width="2.5" />

    <!-- Spider-Man Webbing (Radiating from Brow Apex: 400, 310) -->
    <g stroke="#160205" stroke-width="2.8" opacity="0.88" fill="none" stroke-linecap="round">
      <!-- Radiating Spoke Lines -->
      <line x1="400" y1="310" x2="400" y2="95" />
      <line x1="400" y1="310" x2="445" y2="102" />
      <line x1="400" y1="310" x2="355" y2="102" />
      <line x1="400" y1="310" x2="495" y2="122" />
      <line x1="400" y1="310" x2="305" y2="122" />
      <line x1="400" y1="310" x2="545" y2="165" />
      <line x1="400" y1="310" x2="255" y2="165" />
      <line x1="400" y1="310" x2="574" y2="225" />
      <line x1="400" y1="310" x2="226" y2="225" />
      <line x1="400" y1="310" x2="578" y2="300" />
      <line x1="400" y1="310" x2="222" y2="300" />
      <line x1="400" y1="310" x2="560" y2="385" />
      <line x1="400" y1="310" x2="240" y2="385" />
      <line x1="400" y1="310" x2="515" y2="470" />
      <line x1="400" y1="310" x2="285" y2="470" />
      <line x1="400" y1="310" x2="455" y2="532" />
      <line x1="400" y1="310" x2="345" y2="532" />
      <line x1="400" y1="310" x2="400" y2="570" />

      <!-- Concentric Web Rings (Scalloped) -->
      <!-- Forehead Rings -->
      <path d="M 330,270 Q 365,285 400,287 Q 435,285 470,270" />
      <path d="M 285,220 Q 342,245 400,248 Q 458,245 515,220" />
      <path d="M 252,170 Q 325,198 400,202 Q 475,198 548,170" />
      <path d="M 295,128 Q 348,148 400,152 Q 452,148 505,128" />
      <!-- Lower Face Rings -->
      <path d="M 245,410 Q 320,410 400,435 Q 480,410 555,410" />
      <path d="M 285,475 Q 340,475 400,492 Q 460,475 515,475" />
      <path d="M 342,535 Q 370,530 400,542 Q 430,530 458,535" />
    </g>

    <!-- 3D CAD Wireframe Overlay on Forehead & Chin -->
    <g stroke="#00f2fe" stroke-width="1.2" opacity="0.65" fill="none">
      <polygon points="400,95 445,102 400,152 355,102" />
      <polygon points="400,152 452,148 400,202 348,148" />
      <polygon points="400,202 458,245 400,248 342,245" />
      <polygon points="400,570 458,535 400,542 342,535" />
      <polygon points="400,542 460,475 400,492 340,475" />
    </g>

    <!-- Glowing CAD Anchor Points -->
    <g fill="#00f2fe" filter="url(#cyanGlow)">
      <circle cx="400" cy="95" r="3.5" />
      <circle cx="400" cy="152" r="3" />
      <circle cx="400" cy="202" r="3" />
      <circle cx="400" cy="248" r="3" />
      <circle cx="400" cy="492" r="3" />
      <circle cx="400" cy="542" r="3" />
      <circle cx="400" cy="570" r="3.5" />
    </g>

    <!-- ICONIC ANGULAR SPIDER-MAN EYES -->
    
    <!-- LEFT EYE -->
    <!-- Black Outer Thick Frame (Iconic sharp angled wedge) -->
    <path d="M 252,245 
             C 285,252 350,295 385,348 
             C 388,353 385,358 380,360 
             C 335,378 280,392 245,350 
             C 230,332 232,295 240,265 
             C 243,253 247,246 252,245 Z" 
          fill="#0c0d14" 
          stroke="#1e293b" 
          stroke-width="3.5" />

    <!-- Left White/Cyan Glowing Lens -->
    <path d="M 262,260 
             C 290,268 345,304 372,345 
             C 332,365 288,375 258,342 
             C 246,328 248,298 255,275 
             C 257,268 259,262 262,260 Z" 
          fill="url(#eyeGrad)" />
    <!-- Left Hexagonal CAD Texture -->
    <path d="M 262,260 
             C 290,268 345,304 372,345 
             C 332,365 288,375 258,342 
             C 246,328 248,298 255,275 
             C 257,268 259,262 262,260 Z" 
          fill="url(#hexPattern)" />

    <!-- RIGHT EYE (Symmetrical Mirror) -->
    <!-- Black Outer Thick Frame -->
    <path d="M 548,245 
             C 515,252 450,295 415,348 
             C 412,353 415,358 420,360 
             C 465,378 520,392 555,350 
             C 570,332 568,295 560,265 
             C 557,253 553,246 548,245 Z" 
          fill="#0c0d14" 
          stroke="#1e293b" 
          stroke-width="3.5" />

    <!-- Right White/Cyan Glowing Lens -->
    <path d="M 538,260 
             C 510,268 455,304 428,345 
             C 468,365 512,375 542,342 
             C 554,328 552,298 545,275 
             C 543,268 541,262 538,260 Z" 
          fill="url(#eyeGrad)" />
    <!-- Right Hexagonal CAD Texture -->
    <path d="M 538,260 
             C 510,268 455,304 428,345 
             C 468,365 512,375 542,342 
             C 554,328 552,298 545,275 
             C 543,268 541,262 538,260 Z" 
          fill="url(#hexPattern)" />

    <!-- CAD Crosshairs & Angle Marks on Eyes -->
    <g stroke="#00f2fe" stroke-width="1.2" opacity="0.75" fill="none">
      <circle cx="305" cy="320" r="16" stroke-dasharray="3,3" />
      <line x1="305" y1="298" x2="305" y2="342" />
      <line x1="283" y1="320" x2="327" y2="320" />

      <circle cx="495" cy="320" r="16" stroke-dasharray="3,3" />
      <line x1="495" y1="298" x2="495" y2="342" />
      <line x1="473" y1="320" x2="517" y2="320" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g text-anchor="middle">
    <text x="400" y="670" font-family="'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      <tspan fill="#ffffff">Spidy</tspan><tspan fill="#ff334b">CAD</tspan>
    </text>

    <text x="400" y="708" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="7">
      PRECISION 3D ENGINEERING
    </text>

    <!-- Tech Divider -->
    <g opacity="0.8">
      <line x1="240" y1="732" x2="380" y2="732" stroke="#38bdf8" stroke-width="2" />
      <circle cx="400" cy="732" r="4.5" fill="#ff334b" filter="url(#cyanGlow)" />
      <line x1="420" y1="732" x2="560" y2="732" stroke="#38bdf8" stroke-width="2" />
    </g>
  </g>
</svg>
