<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="maskGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b56" />
      <stop offset="50%" stop-color="#e61937" />
      <stop offset="100%" stop-color="#990b1e" />
    </linearGradient>

    <linearGradient id="eyeGradNav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2f8ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="cyanGlowNav" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadowNav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <pattern id="navGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background Bar -->
  <rect width="900" height="240" rx="20" fill="url(#navBgGrad)" />
  <rect width="900" height="240" rx="20" fill="url(#navGrid)" />
  <rect width="900" height="240" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- LEFT: COMPACT SPIDEY MASK CAD ICON -->
  <g transform="translate(50, 15) scale(0.92)" filter="url(#softShadowNav)">
    <!-- CAD Crosshairs & Ring around Icon -->
    <g stroke="#00f2fe" stroke-width="1" opacity="0.4" fill="none">
      <circle cx="100" cy="100" r="90" stroke-dasharray="4,4" />
      <line x1="100" y1="2" x2="100" y2="198" stroke-dasharray="4,4" />
      <line x1="2" y1="100" x2="198" y2="100" stroke-dasharray="4,4" />
    </g>

    <!-- Mask Base Path -->
    <path d="M 100,20 
             C 142,20 178,50 178,102 
             C 178,145 160,180 128,206 
             C 115,217 106,224 100,226 
             C 94,224 85,217 72,206 
             C 40,180 22,145 22,102 
             C 22,50 58,20 100,20 Z" 
          fill="url(#maskGradNav)" 
          stroke="#ff6b81" 
          stroke-width="2" />

    <!-- Webbing Lines -->
    <g stroke="#160205" stroke-width="2" opacity="0.85" fill="none">
      <line x1="100" y1="112" x2="100" y2="20" />
      <line x1="100" y1="112" x2="135" y2="26" />
      <line x1="100" y1="112" x2="65" y2="26" />
      <line x1="100" y1="112" x2="162" y2="50" />
      <line x1="100" y1="112" x2="38" y2="50" />
      <line x1="100" y1="112" x2="176" y2="85" />
      <line x1="100" y1="112" x2="24" y2="85" />
      <line x1="100" y1="112" x2="174" y2="128" />
      <line x1="100" y1="112" x2="26" y2="128" />
      <line x1="100" y1="112" x2="152" y2="170" />
      <line x1="100" y1="112" x2="48" y2="170" />
      <line x1="100" y1="112" x2="100" y2="226" />

      <!-- Web Rings -->
      <path d="M 68,95 Q 84,103 100,104 Q 116,103 132,95" />
      <path d="M 50,75 Q 75,86 100,88 Q 125,86 150,75" />
      <path d="M 38,55 Q 70,68 100,70 Q 130,68 162,55" />
      <path d="M 46,145 Q 75,145 100,158 Q 125,145 154,145" />
      <path d="M 64,180 Q 82,180 100,190 Q 118,180 136,180" />
    </g>

    <!-- CAD Mesh Wireframe Overlays -->
    <g stroke="#00f2fe" stroke-width="1" opacity="0.7" fill="none">
      <polygon points="100,20 135,26 100,48 65,26" />
      <polygon points="100,226 128,206 100,212 72,206" />
    </g>
    <circle cx="100" cy="20" r="2.5" fill="#00f2fe" filter="url(#cyanGlowNav)" />
    <circle cx="100" cy="226" r="2.5" fill="#00f2fe" filter="url(#cyanGlowNav)" />

    <!-- Left Angular Spidey Eye -->
    <path d="M 38,82 
             C 52,85 80,105 94,128 
             C 96,131 94,133 92,134 
             C 72,143 48,150 34,130 
             C 27,121 28,105 32,91 Z" 
          fill="#0c0d14" stroke="#1e293b" stroke-width="2.5" />
    <path d="M 43,89 
             C 55,92 78,110 88,127 
             C 70,137 51,142 39,127 
             C 34,120 35,106 38,96 Z" 
          fill="url(#eyeGradNav)" />

    <!-- Right Angular Spidey Eye -->
    <path d="M 162,82 
             C 148,85 120,105 106,128 
             C 104,131 106,133 108,134 
             C 128,143 152,150 166,130 
             C 173,121 172,105 168,91 Z" 
          fill="#0c0d14" stroke="#1e293b" stroke-width="2.5" />
    <path d="M 157,89 
             C 145,92 122,110 112,127 
             C 130,137 149,142 161,127 
             C 166,120 165,106 162,96 Z" 
          fill="url(#eyeGradNav)" />
  </g>

  <!-- RIGHT: BRAND WORDMARK & BADGES -->
  <g transform="translate(285, 0)">
    <!-- Main SpidyCAD Title -->
    <text x="0" y="128" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="78" letter-spacing="-1.5">
      <tspan fill="#ffffff">Spidy</tspan><tspan fill="#ff334b">CAD</tspan>
    </text>

    <!-- Version / Status Pill Badge -->
    <g transform="translate(420, 72)">
      <rect width="84" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4" fill="#00f2fe" filter="url(#cyanGlowNav)" />
      <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38bdf8">3D CAD</text>
    </g>

    <!-- Subtitle -->
    <text x="4" y="166" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="5">
      PRECISION ARCHITECTURAL &amp; 3D MODELING
    </text>

    <!-- Tech Line Accent -->
    <g opacity="0.6">
      <line x1="4" y1="184" x2="480" y2="184" stroke="#1e293b" stroke-width="2" />
      <line x1="4" y1="184" x2="160" y2="184" stroke="#ff334b" stroke-width="2" />
      <circle cx="160" cy="184" r="3" fill="#00f2fe" />
    </g>
  </g>
</svg>